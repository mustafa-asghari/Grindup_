services:
  postgres:
    image: postgres:16-alpine
    container_name: grindup-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-grindup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-grindup_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-grindup}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: grindup-redis
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    container_name: grindup-clickhouse
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-grindup}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-grindup}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-grindup_dev_only}
    ports:
      - "${CLICKHOUSE_HTTP_HOST_PORT:-8123}:8123"  # HTTP interface
      - "${CLICKHOUSE_NATIVE_HOST_PORT:-9001}:9000"  # Native protocol
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    # Suppress mempolicy warnings on macOS
    cap_add:
      - SYS_NICE
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user \"$${CLICKHOUSE_USER}\" --password \"$${CLICKHOUSE_PASSWORD}\" --query 'SELECT 1'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  clickhouse-ui:
    image: ghcr.io/caioricciuti/ch-ui:latest
    container_name: clickhouse-ui
    ports:
      - "${CLICKHOUSE_UI_HOST_PORT:-5521}:3488"
    depends_on:
      - clickhouse
    restart: unless-stopped

networks:
  default:
    name: grindup-network
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  clickhouse_data:
  clickhouse_logs:
